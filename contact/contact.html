<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Responsive Contact Us Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">                                  
</head>                                  
<body>
    <section class="contact">
        
        <div class="content">
            <h2>Contact Us</h2>  
            <p>Thank you for your interest. If you have any questions, please fill out the form below and we'll get back to you shortly.</p>
        </div>
        <div class="container">
            <div class="contactInfo">
                <div class="box">
                    <div class="icon"><i class="fa fa-map-marker" aria-hidden="true"></i></div>
                    <div class="text">
                        <h3>Address</h3>  
                        <p>14 no Road,<br>Chadgaon, Chittagong,<br>55060</p>       
                    </div>                                    
                </div>        
                <div class="box">
                    <div class="icon"><i class="fa fa-phone" aria-hidden="true"></i></div>
                    <div class="text">
                        <h3>Phone</h3>  
                        <p>507-407-6094</p>       
                    </div>                                    
                </div>    
                <div class="box">
                    <div class="icon"><i class="fa fa-envelope" aria-hidden="true"></i></div>
                    <div class="text">
                        <h3>Email</h3>  
                        <p>Explorechittagong@gmail.com</p>       
                    </div>                                    
                </div>  
            </div> 
            <div class="contactForm">
                <form>
                    <h2>Send Message</h2>
                    <div class="inputBox">
                        <input type="text" required>
                        <span>Full Name</span>                 
                    </div>   
                    <div class="inputBox">
                        <input type="email" required>
                        <span>Email</span>                 
                    </div>   
                    <div class="inputBox">
                        <textarea required></textarea>
                        <span>Type Your Message...</span>                 
                    </div>  
                    <div class="inputBox">
                        <input type="submit" value="Send">
                    </div>    
                </form>                         
            </div>
        </div>
    </section>                                    
</body>
</html>
